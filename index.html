<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Encuesta de satisfacción</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.08);overflow:hidden}
.hd{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:24px 22px}.hd small{opacity:.85;letter-spacing:.08em;font-size:11px;font-weight:700;text-transform:uppercase}
.hd h1{margin:6px 0 0;font-size:19px;line-height:1.3;letter-spacing:.01em}.bd{padding:20px 22px 24px}p{line-height:1.55;margin:0 0 12px}
.doc{display:inline-block;background:#eff6ff;color:#1e40af;border-radius:10px;padding:8px 12px;font-size:14px;margin:4px 0 14px}
.meta{color:#64748b;font-size:13px;margin-bottom:6px}
.q{border-top:1px solid #e2e8f0;padding-top:18px;margin-top:18px}.q .n{color:#2563eb;font-size:12px;font-weight:800;letter-spacing:.06em}
.q h2{font-size:16px;margin:2px 0 4px}.q .t{color:#475569;font-size:14px;margin-bottom:12px}
.fila{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lista .opt{margin-bottom:8px}
.opt{display:block;position:relative;cursor:pointer}.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:block;border:2px solid #e2e8f0;border-radius:14px;padding:12px 8px;text-align:center;font-weight:600;font-size:14px;background:#fff}
.opt span i{display:block;font-style:normal;font-size:28px;margin-bottom:2px}.opt span small{display:block;color:#64748b;font-weight:400;font-size:12px;margin-top:2px}
.fila .opt span{padding:12px 4px;font-size:13px;white-space:nowrap}
.lista .opt span{text-align:left;display:flex;gap:12px;align-items:center;padding:12px 14px}.lista .opt span i{font-size:26px;margin:0}
.opt input:focus-visible+span{outline:3px solid #93c5fd}
.v1 input:checked+span{border-color:#e11d48;background:#fff1f2}.v2 input:checked+span{border-color:#d97706;background:#fffbeb}.v3 input:checked+span{border-color:#16a34a;background:#f0fdf4}
label.l{display:block;font-weight:700;font-size:14px;margin:0 0 6px}.req{color:#e11d48}.opc{color:#64748b;font-weight:400}
input[type=text],textarea{width:100%;border:2px solid #e2e8f0;border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff}
input[type=text]:focus,textarea:focus{outline:none;border-color:#2563eb}textarea{min-height:110px;resize:vertical}
button,.btn{display:block;width:100%;margin-top:20px;border:0;border-radius:14px;padding:16px;font:inherit;font-weight:800;font-size:16px;color:#fff;background:#2563eb;cursor:pointer;text-align:center;text-decoration:none}
button[disabled]{opacity:.6;cursor:wait}
.msg{padding:12px 14px;border-radius:12px;background:#fef2f2;color:#991b1b;margin-bottom:12px;font-size:14px}.er{color:#b91c1c;font-size:13px;margin-top:6px}
.ok{font-size:48px;text-align:center;margin:0 0 4px}.res{background:#f8fafc;border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}.res div{padding:3px 0}
.cargando{color:#64748b;text-align:center;padding:30px 0}
.ft{color:#94a3b8;font-size:12px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card"></div><div class="ft">Abogada Mariale · Renta House Los Samanes</div></div>
<script>
// ── Única configuración: dirección del servicio que guarda las respuestas ──
const API = 'https://n8n.legaltech.com.ve/webhook/feedback-contrato';
// ────────────────────────────────────────────────────────────────────────────

const PREGUNTAS = [
  { id: 'calidad', n: 1, titulo: 'Calidad de la redacción del contrato', lista: false,
    texto: '¿Cómo califica la claridad, el lenguaje técnico-legal y la estructura general del documento?',
    opciones: [{ v: '1', e: '😕', t: 'Mala' }, { v: '2', e: '😐', t: 'Regular' }, { v: '3', e: '😊', t: 'Buena' }] },
  { id: 'errores', n: 2, titulo: 'Errores en la redacción del contrato', lista: true,
    texto: '¿Cómo evalúa la precisión del documento respecto a la ausencia de errores (en montos, nombres, linderos o datos de identificación)?',
    opciones: [
      { v: '1', e: '😕', t: 'Mala', d: 'Se encontraron errores significativos que requirieron corrección' },
      { v: '2', e: '😐', t: 'Regular', d: 'Hubo detalles menores que ajustar' },
      { v: '3', e: '😊', t: 'Buena', d: 'El documento estaba completamente correcto desde la primera entrega' }] },
  { id: 'tiempo', n: 3, titulo: 'Tiempo de respuesta', lista: false,
    texto: '¿Cómo califica la velocidad y la puntualidad en la entrega del borrador y sus modificaciones?',
    opciones: [{ v: '1', e: '😕', t: 'Mala' }, { v: '2', e: '😐', t: 'Regular' }, { v: '3', e: '😊', t: 'Buena' }] }
];
const ETIQUETA = { '1': '😕 Mala', '2': '😐 Regular', '3': '😊 Buena' };

const card = document.getElementById('card');
const token = (new URLSearchParams(location.search).get('t') || '').trim();

// Construye elementos del DOM sin usar innerHTML (todo lo que viene del servidor se muestra como texto)
function h(tag, attrs, ...hijos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  hijos.flat().forEach(c => { if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return el;
}
const cabecera = () => h('div', { class: 'hd' }, h('small', {}, 'Revisión de contrato'), h('h1', {}, 'ENCUESTA DE SATISFACCIÓN: GESTIÓN DE CONTRATOS'));
function pintar(...cuerpo) { card.replaceChildren(cabecera(), h('div', { class: 'bd' }, cuerpo)); window.scrollTo(0, 0); }
const mensaje = (titulo, texto, extra) => pintar(h('p', { style: 'font-size:17px' }, h('b', {}, titulo)), h('p', {}, texto), extra);

function cargando() { pintar(h('p', { class: 'cargando' }, 'Cargando su encuesta…')); }

function errorDeRed(reintentar) {
  const b = h('button', { type: 'button' }, 'Reintentar');
  b.onclick = reintentar;
  mensaje('No pudimos conectar', 'Revise su conexión a internet e inténtelo de nuevo en un momento.', b);
}

function gracias(valores) {
  const resumen = h('div', { class: 'res' }, PREGUNTAS.map(q => h('div', {}, `${q.n}. ${q.titulo}: `, h('b', {}, ETIQUETA[valores[q.id]]))));
  pintar(
    h('p', { class: 'ok' }, '✅'),
    h('p', { style: 'text-align:center;font-size:18px' }, h('b', {}, '¡Gracias por su opinión!')),
    h('p', { style: 'text-align:center;color:#475569' }, 'Su respuesta fue registrada y la Abogada la recibió de inmediato. Nos ayuda a seguir mejorando.'),
    resumen,
    h('p', { style: 'text-align:center;color:#94a3b8;font-size:13px' }, 'Ya puede cerrar esta página.')
  );
}

function formulario(datos, valores, errores, aviso) {
  valores = valores || {}; errores = errores || {};
  const hayErrores = Object.keys(errores).length > 0;
  const f = h('form', { novalidate: false });

  f.append(h('div', { class: 'q', style: 'border:0;margin-top:8px;padding-top:0' },
    h('label', { class: 'l', for: 'nombre' }, 'Nombre del Asesor / Agencia Inmobiliaria ', h('span', { class: 'req' }, '*')),
    h('input', { type: 'text', id: 'nombre', name: 'nombre', maxlength: '120', autocomplete: 'name', required: true, value: valores.nombre !== undefined ? valores.nombre : (datos.nombre || '') }),
    errores.nombre ? h('div', { class: 'er' }, '⚠️ ' + errores.nombre) : null));

  PREGUNTAS.forEach(q => {
    const ops = q.opciones.map(o => h('label', { class: 'opt v' + o.v },
      h('input', { type: 'radio', name: q.id, value: o.v, required: true, checked: valores[q.id] === o.v }),
      h('span', {}, h('i', {}, o.e), q.lista ? h('b', {}, `${o.v} · ${o.t}`, h('small', {}, o.d)) : `${o.v} · ${o.t}`)));
    f.append(h('div', { class: 'q' },
      h('div', { class: 'n' }, `PREGUNTA ${q.n} DE 3`),
      h('h2', {}, q.titulo + ' ', h('span', { class: 'req' }, '*')),
      h('div', { class: 't' }, q.texto),
      h('div', { class: q.lista ? 'lista' : 'fila' }, ops),
      errores[q.id] ? h('div', { class: 'er' }, '⚠️ ' + errores[q.id]) : null));
  });

  const ta = h('textarea', { id: 'comentarios', name: 'comentarios', maxlength: '1500', placeholder: 'Cuéntenos qué podemos mejorar…' });
  ta.value = valores.comentarios || '';
  f.append(h('div', { class: 'q' },
    h('label', { class: 'l', for: 'comentarios' }, 'Comentarios o sugerencias para mejorar ', h('span', { class: 'opc' }, '(opcional)')), ta));
  const boton = h('button', { type: 'submit' }, 'Enviar encuesta');
  f.append(boton);

  f.onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(f);
    const v = { nombre: String(fd.get('nombre') || '').trim(), calidad: fd.get('calidad') || '', errores: fd.get('errores') || '', tiempo: fd.get('tiempo') || '', comentarios: String(fd.get('comentarios') || '').trim() };
    boton.disabled = true; boton.textContent = 'Enviando…';
    try {
      const r = await fetch(API + '?t=' + encodeURIComponent(token) + '&json=1', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: new URLSearchParams({ ...v, json: '1' })
      });
      const d = await r.json();
      if (d.ok) return gracias(v);
      if (d.motivo === 'respondida') return mensaje('¡Ya recibimos su respuesta!', 'Esta encuesta ya fue completada. Muchas gracias por su opinión.');
      if (d.motivo === 'errores') return formulario(datos, v, d.errores || {});
      return mensaje('Enlace no válido o vencido', 'No encontramos este contrato. Abra de nuevo el botón desde el correo de la Abogada.');
    } catch (e) {
      formulario(datos, v, {}, 'No pudimos enviar su respuesta. Revise su conexión e inténtelo de nuevo.');
    }
  };

  pintar(
    aviso ? h('div', { class: 'msg' }, h('b', {}, aviso)) : null,
    hayErrores ? h('div', { class: 'msg' }, h('b', {}, 'Falta completar algunas respuestas.'), ' Revise los campos marcados.') : null,
    h('p', {}, 'Estimado/a asesor/a, su opinión es fundamental para seguir optimizando nuestros procesos legales. Le solicitamos responder brevemente estas 3 preguntas sobre el documento que acabamos de tramitar:'),
    h('div', { class: 'doc' }, '📄 ', h('b', {}, datos.asunto || 'Contrato')),
    h('div', { class: 'meta' }, '⏱ Menos de 1 minuto'),
    f);
}

async function iniciar() {
  if (!token) return mensaje('Enlace no válido o vencido', 'No encontramos este contrato. Abra de nuevo el botón desde el correo de la Abogada.');
  cargando();
  try {
    const r = await fetch(API + '?t=' + encodeURIComponent(token) + '&json=1', { cache: 'no-store' });
    const d = await r.json();
    if (!d.ok) return mensaje('Enlace no válido o vencido', 'No encontramos este contrato. Abra de nuevo el botón desde el correo de la Abogada o escríbale directamente.');
    if (d.estado === 'Respondida') return mensaje('¡Ya recibimos su respuesta!', 'Esta encuesta ya fue completada. Muchas gracias por su opinión.', h('p', { style: 'color:#64748b' }, 'Si necesita corregir algo, escríbale a la Abogada.'));
    formulario(d);
  } catch (e) {
    errorDeRed(iniciar);
  }
}
iniciar();
</script>
</body>
</html>
